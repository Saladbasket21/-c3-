services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["node", "server.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://localhost:3000/api/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - NODE_ENV=production
